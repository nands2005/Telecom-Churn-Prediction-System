<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telecom Customer Churn Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>📞 Telecom Customer Churn Prediction</h1>

        <form action="/predict" method="POST">

            <div class="row">

                <label>Contract</label>

                <select name="Contract" required>

                    <option value="">Select Contract</option>
                    <option value="0">Month-to-Month</option>
                    <option value="1">One Year</option>
                    <option value="2">Two Year</option>

                </select>

            </div>


            <div class="row">

                <label>Tenure (Months)</label>

                <input type="number" name="TenureMonths" min="1" required>

            </div>


            <div class="row">

                <label>Internet Service</label>

                <select name="InternetService" required>

                    <option value="">Select Service</option>
                    <option value="0">DSL</option>
                    <option value="1">Fiber Optic</option>
                    <option value="2">No Internet</option>

                </select>

            </div>


            <div class="row">

                <label>Monthly Charges</label>

                <input type="number" step="0.01" name="MonthlyCharges" required>

            </div>


            <div class="row">

                <label>Total Charges</label>

                <input type="number" step="0.01" name="TotalCharges" required>

            </div>


            <div class="row full-width">

                <label>Customer Complaint</label>

                <textarea name="Complaint" rows="5" placeholder="Describe the customer's complaint..."
                    required></textarea>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button type="submit">

                    Predict Churn

                </button>

                <button type="button" class="dashboard-btn" onclick="window.location.href='/dashboard'">

                    View Dashboard

                </button>

            </div>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>{{ prediction }}</h2>

            <h3>Churn Probability : {{ probability }}%</h3>

            <hr style="margin:15px 0;">

            <p><strong>Complaint:</strong></p>

            <p>{{ complaint }}</p>

            <br>

            <p><strong>Sentiment:</strong> {{ sentiment }}</p>

            <br>

            <h3>AI Retention Recommendations</h3>

            <ul>

                {% for item in recommendations %}

                <li>{{ item }}</li>

                {% endfor %}

            </ul>

        </div>

        {% endif %}

    </div>

</body>

</html>
